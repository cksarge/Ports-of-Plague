,57.3],[3,59],[4.4,59.9]]}]};var ci={note:"Each round is half a year. Which cities the plague reaches in each round is set by arrival.round in cities.json; the dated chronicle cards for each round are in events.json.",prologue:{label:"1346",text:"The plague breaks out at the siege of Caffa on the Black Sea.",factIds:["TL-01","TR-02"]},prePlague:[{round:-1,label:"Late 1346",months:"July\u2013December 1346",season:"warm",headline:"The Golden Horde besieges Caffa, but the sea lanes stay open.",factIds:["TR-02","TR-12"]},{round:0,label:"Early 1347",months:"January\u2013June 1347",season:"cold",headline:"Merchants ready their ships for the sailing season.",factIds:["TR-04","EC-01"]}],rounds:[{round:1,label:"Late 1347",months:"July\u2013December 1347",season:"warm",headline:"The plague sails into the Mediterranean.",factIds:["TR-07","TL-03","TR-06"]},{round:2,label:"Early 1348",months:"January\u2013June 1348",season:"cold",headline:"Italy, southern France and Spain are struck.",factIds:["TL-04","TL-05","TL-06"]},{round:3,label:"Late 1348",months:"July\u2013December 1348",season:"warm",headline:"Paris and England fall to the pestilence.",factIds:["TL-07","TL-08","TR-08"]},{round:4,label:"Early 1349",months:"January\u2013June 1349",season:"cold",headline:"Germany, Austria and the Low Countries.",factIds:["TL-02"]},{round:5,label:"Late 1349",months:"July\u2013December 1349",season:"warm",headline:"North to Norway along the sea lanes.",factIds:["TR-09","CI-13"]},{round:6,label:"Early 1350",months:"January\u2013June 1350",season:"cold",headline:"The Baltic, and a Holy Year in Rome.",factIds:["TL-02","CH-08"]},{round:7,label:"Late 1350",months:"July\u2013December 1350",season:"warm",headline:"Survivors count the cost.",factIds:["SO-12","EC-04"]},{round:8,label:"Early 1351",months:"January\u2013June 1351",season:"cold",headline:"Laws try to hold back wages.",factIds:["EC-06"]},{round:9,label:"Late 1351",months:"July\u2013December 1351",season:"warm",headline:"The plague creeps toward Russia.",factIds:["TR-10"]},{round:10,label:"Early 1352",months:"January\u2013June 1352",season:"cold",headline:"Trade revives.",factIds:["TR-11"]},{round:11,label:"Late 1352",months:"July\u2013December 1352",season:"warm",headline:"Novgorod is struck; the pope dies.",factIds:["TR-10","CH-01"]},{round:12,label:"Early 1353",months:"January\u2013June 1353",season:"cold",headline:"Moscow is ravaged.",factIds:["TR-10","TL-10"]}],epilogue:{title:"What Really Happened",factIds:["DB-01","ME-01","ME-10","TL-11","TL-12","TL-10","EC-08","EC-07","ME-14","ME-15"]}};var aa={note:"Chronicle cards are dated history and always appear in their round. Event cards are shuffled; one is drawn each round. Fortune cards are a personal deck: a house draws one when it rolls a 6 on the profit die or opens a trading post. Every card lists the fact IDs its history comes from. Effects are carried out by src/engine/events.js and src/engine/fortune.js.",chronicle:[{id:"CHR-banks",round:-1,theme:"economic",title:"The Great Banks Fall",text:"Hard times before the plague: Florence's great banking houses have collapsed one after another, and famine stalks Italy. Merchants who want to grow must look for new ports and partners.",factIds:["EC-01","EC-11"],effect:{type:"none"}},{id:"CHR-tana",round:0,theme:"trade",title:"Back to Tana",text:"The Mongol khan lets the Italian merchants return to their trading post at Tana on the Don. The sea lanes from the Black Sea to Bruges are busy, and trading posts are cheaper to open than they will ever be again.",factIds:["TR-12","TR-04"],effect:{type:"none"}},{id:"CHR-caffa",round:1,theme:"trade",title:"The Siege of Caffa",text:"News comes from the Black Sea: a Mongol army besieged the Genoese port of Caffa, plague broke out, and Italian ships fled west carrying the sickness with them.",factIds:["TR-01","TR-02","TR-03"],effect:{type:"none"}},{id:"CHR-messina",round:1,theme:"trade",title:"Twelve Galleys at Messina",text:"Genoese galleys arrive in Messina with sick sailors. The city drives them out, but the disease has already come ashore.",factIds:["TR-06","TR-07","CI-11"],effect:{type:"none"}},{id:"CHR-avignon",round:2,theme:"church",title:"The Great Mortality at Avignon",text:"The plague reaches the papal city of Avignon. The pope's physician, Guy de Chauliac, records what he sees.",factIds:["TL-05","ME-03","CH-01","CH-02","ME-02"],effect:{type:"none"}},{id:"CHR-gates",round:2,theme:"social",title:"Cities Guard Their Gates",text:"Frightened towns post guards and turn strangers away. This round, no one may open a trading post in a Stricken city or in a city next to one.",factIds:["SO-11","ME-12"],effect:{type:"noNewPostsNearPlague"}},{id:"CHR-florence",round:2,theme:"cities",title:"Florence, 1348",text:"In Florence those who can afford it flee to the countryside, while others hold sweet-smelling flowers to their noses against the 'bad air.'",factIds:["CI-01","SO-04","ME-07"],effect:{type:"none"}},{id:"CHR-paris-report",round:3,theme:"medical",title:"The Paris Report",text:"The medical faculty of the University of Paris issues its official explanation of the plague. Their answer: the planets and corrupt air.",factIds:["ME-04","ME-05"],effect:{type:"none"}},{id:"CHR-accusation",round:3,theme:"persecution",title:"A False Accusation, and a Pope's Reply",text:"Rumors spread that Jews poisoned the wells. The accusation is false: Jews are dying of the plague too. Pope Clement VI issues bulls rejecting the lie and calling for Jews to be protected, but far from Avignon few listen.",factIds:["SO-07","SO-08"],effect:{type:"none"}},{id:"CHR-england",round:3,theme:"trade",title:"A Ship to England",text:"A ship brings the plague to Melcombe Regis in Dorset. From there it spreads across England.",factIds:["TR-08","ME-13"],effect:{type:"none"}},{id:"CHR-strasbourg",round:4,theme:"persecution",title:"Strasbourg, February 1349",text:"In Strasbourg a mob overthrows the council that refused to harm the Jewish community, and the community is murdered, before the plague has even reached the city. The accusations were false. The violence was unjust. Your house may take a costly stand to shelter and defend the community.",factIds:["SO-09","SO-10","SO-07"],effect:{type:"persecution",city:"strasbourg"}},{id:"CHR-ordinance",round:4,theme:"economic",title:"The Ordinance of Labourers",text:"With workers scarce, England's government orders wages frozen at pre-plague levels. Merchants with posts in England must decide whether to obey.",factIds:["EC-05","EC-03"],effect:{type:"wageLaw",cities:["london","melcombe"]}},{id:"CHR-flagellants",round:4,theme:"social",title:"The Flagellants Arrive",text:"A flagellant procession arrives, marching with crosses and banners, whipping themselves to beg God's mercy. Will your house give them alms?",factIds:["SO-02","SO-01"],effect:{type:"offer",id:"flagellantAlms",label:"Give alms to the flagellants",cost:{florins:2},gain:{reputation:1},decline:"Keep your distance"}},{id:"CHR-ban",round:5,theme:"church",title:"The Pope Bans the Flagellants",text:"Pope Clement VI condemns the flagellant movement and forbids its processions. Houses that gave alms to the flagellants lose 1 reputation.",factIds:["SO-03"],effect:{type:"reputationIfOffer",offer:"flagellantAlms",reputation:-1}},{id:"CHR-confess",round:5,theme:"church",title:"Confess to Anyone",text:"So many priests have died that a bishop allows the dying to confess to any layperson. Parishes need help: Charity & Piety gives +1 extra reputation this round.",factIds:["CH-05","CH-03"],effect:{type:"charityBonus",delta:1}},{id:"CHR-north",round:5,theme:"trade",title:"Hanseatic Ships Sail North",text:"A ship from England brings the plague to Bergen. Hanseatic ships heading home carry it to the Baltic.",factIds:["TR-09","CI-13"],effect:{type:"none"}},{id:"CHR-jubilee",round:6,theme:"church",title:"The Jubilee of 1350",text:"Despite the plague, pilgrims crowd the roads to Rome for the Holy Year. Your house may pay for a pilgrimage.",factIds:["CH-08"],effect:{type:"offer",id:"jubilee",label:"Fund a pilgrimage to Rome",cost:{florins:3},gain:{reputation:2},decline:"Stay home"}},{id:"CHR-baltic",round:6,theme:"timeline",title:"The Plague Reaches the Baltic",text:"The plague reaches Scandinavia and the Baltic lands.",factIds:["TL-02"],effect:{type:"none"}},{id:"CHR-marry",round:7,theme:"social",title:"Survivors Marry",text:"With the epidemic fading, survivors marry and many children are born. Houses that have lost 2 or more family members gain 1 family member.",factIds:["SO-12"],effect:{type:"newFamily",minLost:2,gain:1}},{id:"CHR-dear",round:7,theme:"economic",title:"Everything Twice as Dear",text:"Prices climb everywhere. This round, shipments to Aftermath cities earn +1 extra.",factIds:["EC-04"],effect:{type:"marketBonus",delta:1}},{id:"CHR-statute",round:8,theme:"economic",title:"The Statute of Labourers",text:"England's first Parliament after the plague strengthens the wage freeze. Merchants with posts in England must decide again whether to obey.",factIds:["EC-06","EC-07"],effect:{type:"wageLaw",cities:["london","melcombe"]}},{id:"CHR-russia",round:9,theme:"trade",title:"Toward Russia",text:"The plague enters the lands of Novgorod, not from the east, but from the west along the trade routes.",factIds:["TR-10"],effect:{type:"none"}},{id:"CHR-society",round:9,theme:"economic",title:"Lords Must Pay",text:"Short of workers, landowners start paying wages and money rents. This round the player in last place gains 3 florins.",factIds:["EC-02","SO-13"],effect:{type:"lastPlaceBonus",florins:3}},{id:"CHR-revive",round:10,theme:"trade",title:"Trade Revives",text:"The slump in trade after the plague does not last. This round every shipment earns +1.",factIds:["TR-11"],effect:{type:"roundModifier",profit:1}},{id:"CHR-clement",round:11,theme:"church",title:"Death of Clement VI",text:"Pope Clement VI dies at Avignon in December 1352.",factIds:["CH-01"],effect:{type:"none"}},{id:"CHR-novgorod",round:11,theme:"cities",title:"Novgorod",text:"The plague breaks out in the city of Novgorod.",factIds:["TR-10"],effect:{type:"none"}},{id:"CHR-moscow",round:12,theme:"cities",title:"Moscow, 1353",text:"The plague ravages Moscow, nearly the last major city it reaches. Europe begins its long recovery, but the plague will return.",factIds:["TR-10","TL-10","EC-08"],effect:{type:"none"}}],deck:[{id:"EV-wages",theme:"economic",title:"Wages Rise",text:"Workers are scarce and demand more. This round the wage for shipping from an Aftermath city is 1 florin higher.",factIds:["EC-03"],effect:{type:"costModifier",cost:"wageAftermath",delta:1}},{id:"EV-prices",theme:"economic",title:"Prices Soar",text:"Goods are scarce and prices jump. This round, shipments to Aftermath cities earn +1 extra.",factIds:["EC-04"],effect:{type:"marketBonus",delta:1}},{id:"EV-fields",theme:"economic",title:"Fields Go Unplowed",text:"With so many laborers dead, land lies empty and rents fail. Lose 1 florin for each of your trading posts in an Aftermath city.",factIds:["EC-02"],effect:{type:"florinsPerPost",state:"aftermath",florins:-1}},{id:"EV-slump",theme:"trade",title:"Trade Slump",text:"Buyers are dead or gone. This round every shipment earns 1 less.",factIds:["TR-11"],effect:{type:"roundModifier",profit:-1}},{id:"EV-wars",theme:"economic",title:"Wars Pause",text:"For a short time the plague halts the fighting. This round sea shipments earn +1.",factIds:["EC-09"],effect:{type:"roundModifier",profit:1,routeType:"sea"}},{id:"EV-banks",theme:"economic",title:"Memories of the Bank Crash",text:"Creditors remember the Florentine bank failures and call in their loans. Every house with 20 or more florins pays 2 florins.",factIds:["EC-01"],effect:{type:"loseIfRich",threshold:20,florins:2}},{id:"EV-flight",theme:"social",title:"Flight to the Countryside",text:"Carts crowd the roads out of town. This round you may take one Move Family action without spending an action point. (Fleeing still costs reputation.)",factIds:["SO-04"],effect:{type:"freeAction",action:"move"}},{id:"EV-doors",theme:"social",title:"Behind Closed Doors",text:"Some families shut themselves away from the sick. This round you may take one Prepare Household action for free: no action point, no florins.",factIds:["SO-05"],effect:{type:"freeAction",action:"prepare"}},{id:"EV-gates",theme:"social",title:"Guards at the Gates",text:"Towns turn away strangers. This round, no one may open a trading post in a Stricken city or in a city next to one.",factIds:["SO-11"],effect:{type:"noNewPostsNearPlague"}},{id:"EV-torn",theme:"social",title:"Families Torn Apart",text:"Fear makes people abandon even their own relatives. Will your house care for the sick of your street?",factIds:["SO-06"],effect:{type:"offer",id:"careSick",label:"Care for the sick",cost:{florins:2},gain:{reputation:1},decline:"Stay away"}},{id:"EV-procession",theme:"social",title:"A Punishment from God?",text:"Believing the plague is punishment for sin, your city holds a penitential procession. Will your house pay for candles and banners?",factIds:["SO-01"],effect:{type:"offer",id:"procession",label:"Fund the procession",cost:{florins:2},gain:{reputation:1},decline:"Decline"}},{id:"EV-opportunity",theme:"social",title:"New Opportunities",text:"With so many dead, survivors can bargain for better terms. The player in last place gains 3 florins.",factIds:["SO-13"],effect:{type:"lastPlaceBonus",florins:3}},{id:"EV-quack",theme:"medical",title:"A Remedy Seller",text:"A seller offers a 'sure cure' of theriac and aloe pills for 3 florins. Buy it?",factIds:["ME-06","ME-08"],effect:{type:"offer",id:"quack",label:"Buy the cure",cost:{florins:3},gain:{},decline:"Refuse",reveal:"The 'cure' does nothing. No medieval remedy could cure the plague."}},{id:"EV-summer",theme:"medical",title:"A Hot Season",text:"The plague spreads fastest in warm weather. This round the contagion risk on every shipment is 1 higher.",factIds:["TL-09","ME-05"],effect:{type:"contagionModifier",delta:1}},{id:"EV-stayed",theme:"medical",title:"A Doctor Who Stayed",text:"People remember who stayed and who ran. Houses with no family at a country estate gain 1 reputation; houses with family at an estate lose 1.",factIds:["ME-09","SO-04"],effect:{type:"reputationByFlight",stayed:1,fled:-1}},{id:"EV-planets",theme:"medical",title:"Astrologers' Advice",text:"Physicians consult the stars and are eager for patients. This round Consult Physician costs 1 florin less.",factIds:["ME-04"],effect:{type:"costModifier",cost:"physician",delta:-1}},{id:"EV-mask",theme:"medical",title:"Myth Buster: The Beaked Mask",text:"You will not see any beaked 'plague doctors' in this game. That costume was invented almost 300 years later.",factIds:["ME-11"],effect:{type:"none"}},{id:"EV-ships",theme:"medical",title:"Crowded Ships",text:"Scholars still debate whether rats or people carried the plague, but crowded ships spread it either way. This round the contagion risk on sea shipments is 1 higher.",factIds:["ME-10","TR-05"],effect:{type:"contagionModifier",delta:1,routeType:"sea"}},{id:"EV-winter",theme:"medical",title:"Winter Cold",text:"Cold weather slows the plague. This round the contagion risk on every shipment is 1 lower.",factIds:["TL-09"],effect:{type:"contagionModifier",delta:-1}},{id:"EV-clergy",theme:"church",title:"The Clergy Hit Hard",text:"Priests who tended the dying have died themselves. Charity & Piety gives +1 extra reputation this round.",factIds:["CH-03"],effect:{type:"charityBonus",delta:1}},{id:"EV-faith",theme:"church",title:"Faith Shaken",text:"Many people lose trust in the Church. Charity & Piety gives 1 less reputation this round.",factIds:["CH-06"],effect:{type:"charityBonus",delta:-1}},{id:"EV-hours",theme:"church",title:"Religion at Home",text:"Families pray at home with Books of Hours. Will your house buy one?",factIds:["CH-07"],effect:{type:"offer",id:"bookOfHours",label:"Buy a Book of Hours",cost:{florins:2},gain:{reputation:1},decline:"Decline"}},{id:"EV-archbishops",theme:"church",title:"Two Archbishops in a Row",text:"Canterbury loses two archbishops one after the other, and churches everywhere need support. This round Charity & Piety costs 1 florin less.",factIds:["CH-04"],effect:{type:"costModifier",cost:"charity",delta:-1}},{id:"EV-avignon",theme:"church",title:"Petitions to Avignon",text:"The papal court has lost a quarter of its staff and needs merchants' help. Houses with a trading post in Avignon gain 1 reputation.",factIds:["CH-02"],effect:{type:"postBonus",cities:["avignon"],reputation:1}},{id:"EV-fast",theme:"trade",title:"Faster by Sea",text:"Ships race between ports. This round sea shipments earn +1, but their contagion risk is also 1 higher.",factIds:["TR-05"],effect:{type:"multi",effects:[{type:"roundModifier",profit:1,routeType:"sea"},{type:"contagionModifier",delta:1,routeType:"sea"}]}},{id:"EV-network",theme:"trade",title:"The Great Network",text:"London and Bruges link the Italian trade to the Hanseatic League. Houses with a trading post in London or Bruges gain 2 florins.",factIds:["TR-04"],effect:{type:"postBonus",cities:["london","bruges"],florins:2}},{id:"EV-tally",theme:"cities",title:"The Chronicler's Tally",text:"Chroniclers write down huge death tolls, but their numbers rarely agree. How do historians know how many died?",factIds:["CI-02","DB-01"],effect:{type:"none"}},{id:"EV-uneven",theme:"cities",title:"Uneven Losses",text:"Some regions escape lightly while others are devastated. This round Stricken cities in Tuscany and Catalonia (Florence, Pisa, Barcelona) earn 1 less on shipments.",factIds:["CI-06"],effect:{type:"cityProfitModifier",cities:["florence","pisa","barcelona"],onlyStricken:!0,profit:-1}},{id:"EV-siena",theme:"cities",title:"Siena's Unfinished Cathedral",text:"Tuscany has lost so many people that great building projects stop. Houses with trading posts in Florence or Pisa lose 1 florin.",factIds:["CI-04"],effect:{type:"postBonus",cities:["florence","pisa"],florins:-1}},{id:"EV-scholar",theme:"cities",title:"A Scholar's Loss",text:"Across the sea in Tunis, the plague takes both parents of the young Ibn Khaldun. Houses with a trading post in Tunis gain 1 reputation for helping his community.",factIds:["CI-08"],effect:{type:"postBonus",cities:["tunis"],reputation:1}},{id:"EV-avignon-letter",theme:"church",title:"A Letter from Avignon",text:"The papal court thanks one house, chosen at random, for its loyalty. That house gains 2 reputation.",factIds:["CH-01"],effect:{type:"onePlayer",effect:{type:"gain",reputation:2}}},{id:"EV-will",theme:"economic",title:"An Unexpected Will",text:"One house, chosen at random, inherits a dead partner's goods. That house gains 4 florins.",factIds:["EC-10"],effect:{type:"onePlayer",effect:{type:"gain",florins:4}}},{id:"EV-loan",theme:"economic",title:"An Old Loan",text:"One house, chosen at random, must repay an old loan to nervous bankers. That house loses 3 florins.",factIds:["EC-01"],effect:{type:"onePlayer",effect:{type:"gain",florins:-3}}},{id:"EV-seized",theme:"social",title:"Cargo Seized at the Gate",text:"Guards at a city gate seize a cart belonging to one house, chosen at random. That house loses 2 florins.",factIds:["SO-11"],effect:{type:"onePlayer",effect:{type:"gain",florins:-2}}}],fortune:[{id:"FO-spices",tone:"good",title:"A Cargo of Spices",text:"Your agents buy pepper and cinnamon cheaply in the eastern markets. Gain 5 florins.",factIds:["TR-04"],effect:{type:"gain",florins:5}},{id:"FO-galley",tone:"good",title:"A Fast Galley",text:"A swift ship joins your fleet. Your next shipment this round earns 3 extra florins.",factIds:["TR-05"],effect:{type:"nextShip",profit:3}},{id:"FO-clean",tone:"good",title:"A Clean Hold",text:"Your crew scrubs the hold and turns away sick passengers. Your next shipment this round cannot be infected: no contagion die is rolled.",factIds:["ME-10"],effect:{type:"nextShip",profit:0,safe:!0}},{id:"FO-credit",tone:"good",title:"A Letter of Credit",text:"A banker backs your venture with gold florins. Take 1 extra action point this turn.",factIds:["EC-11"],effect:{type:"extraAP",ap:1}},{id:"FO-partners",tone:"good",title:"Hanseatic Partners",text:"Northern merchants offer you space in their warehouse. Your next Open Trading Post this round costs no florins and no action point.",factIds:["TR-04","TR-09"],effect:{type:"freeAction",action:"post"}},{id:"FO-will",tone:"good",title:"A Cousin's Will",text:"A distant relative dies and leaves your house property. Gain 4 florins.",factIds:["EC-10"],effect:{type:"gain",florins:4}},{id:"FO-wedding",tone:"good",title:"A Wedding",text:"A marriage brings a new member into your house. Gain 1 family member (a house can have at most 5).",factIds:["SO-12"],effect:{type:"newFamily",gain:1}},{id:"FO-doctor",tone:"good",title:"A Doctor Who Stays",text:"A brave physician offers to care for your family. Your next Consult Physician this round costs no florins and no action point.",factIds:["ME-09"],effect:{type:"freeAction",action:"physician"}},{id:"FO-refuge",tone:"good",title:"A Country Refuge",text:"Friends offer your family shelter in the countryside. Your next Move Family this round is free, and fleeing costs no reputation.",factIds:["SO-04"],effect:{type:"freeAction",action:"moveNoPenalty"}},{id:"FO-blessing",tone:"good",title:"A Pilgrim's Blessing",text:"Pilgrims praise your house's piety on the roads to Rome. Gain 1 reputation.",factIds:["CH-08"],effect:{type:"gain",reputation:1}},{id:"FO-chronicler",tone:"good",title:"The Chronicler's Praise",text:"A chronicler writes kindly of your house, though his numbers are rarely exact. Gain 1 reputation.",factIds:["CI-02"],effect:{type:"gain",reputation:1}},{id:"FO-letters",tone:"good",title:"Letters from the East",text:"Your agents send warning ahead of the plague. You see which cities it reaches next round, according to history.",factIds:["TR-07","TL-02"],effect:{type:"omen"}},{id:"FO-treaty",tone:"good",title:"A Trade Treaty",text:"You sign a trade treaty with the poorest rival house. You each gain 2 florins.",factIds:["TR-04"],effect:{type:"treaty",florins:2}},{id:"FO-confraternity",tone:"choice",title:"A Confraternity Invites You",text:"A lay brotherhood that cares for the sick invites your house to join. Pay 3 florins to gain 2 reputation?",factIds:["CH-07"],effect:{type:"offer",id:"fortuneConfraternity",label:"Join the confraternity",cost:{florins:3},gain:{reputation:2},decline:"Decline politely"}},{id:"FO-fires",tone:"choice",title:"Fear of Bad Air",text:"Neighbours demand that you light fires to 'purify' the air. Pay 2 florins, or lose 1 reputation. (The fires do nothing against the plague.)",factIds:["ME-05","ME-06"],effect:{type:"offer",id:"fortuneFires",label:"Pay for the fires",cost:{florins:2},gain:{},decline:"Refuse",declinePenalty:{reputation:1}}},{id:"FO-wages",tone:"choice",title:"Workers Demand Double",text:"With labour scarce, your workers want double wages. Pay 3 florins, or your home post cannot ship this round.",factIds:["EC-04","EC-06"],effect:{type:"offer",id:"fortuneWages",label:"Pay the wages",cost:{florins:3},gain:{},decline:"Refuse",declinePenalty:{blockHome:!0}}},{id:"FO-turned",tone:"bad",title:"Turned Away at Port",text:"A frightened port drives your ship away, as Messina drove out the Genoese. Lose 2 florins.",factIds:["CI-11"],effect:{type:"gain",florins:-2}},{id:"FO-held",tone:"bad",title:"Held Offshore",text:"Officials make your ship wait at sea before it may land. Your next shipment this round earns 2 florins less.",factIds:["ME-12"],effect:{type:"nextShip",profit:-2}},{id:"FO-creditors",tone:"bad",title:"Creditors Call",text:"Remembering the great bank crashes, your lenders want their money back. Lose 10 percent of your florins (rounded down).",factIds:["EC-01"],effect:{type:"losePercent",percent:10}},{id:"FO-illness",tone:"bad",title:"Illness in the House",text:"A fever strikes. If any of your family live in a Stricken city, one of them must roll for survival right now.",factIds:["ME-02","ME-03"],effect:{type:"illness"}},{id:"FO-gates",tone:"bad",title:"Closed Gates",text:"Guards turn your agents away. Opening a trading post costs you 4 florins more this round.",factIds:["SO-11"],effect:{type:"personalCost",cost:"openPost",delta:4}},{id:"FO-servants",tone:"bad",title:"Servants Flee",text:"Your servants run from the city in fear. Lose 1 action point this turn, if you have one left.",factIds:["SO-06"],effect:{type:"extraAP",ap:-1}}]};var di={note:"Single source for BOTH the in-game Rules screen and the printable Rule Book. {{a.b}} inserts a value from config.json; {{fact:ID}} inserts a fact reference. Inline **bold** and *italic* are supported.",title:"Ports of Plague",subtitle:"A game of trade, survival and conscience during the Black Death, 1347\u20131353",sections:[{id:"background",title:"Historical Background",blocks:[{type:"p",text:"In 1346 plague broke out among the Mongol army besieging the Genoese port of Caffa on the Black Sea {{fact:TR-02}}. Italian merchant ships carried it to Constantinople, then to Sicily in October 1347 {{fact:TR-06}}, and from there along the trade routes to almost every corner of Europe by 1353 {{fact:TL-02}} {{fact:TR-10}}. Somewhere between a third and 60 percent of Europeans died; historians still debate the number {{fact:DB-01}}."},{type:"p",text:"You lead a merchant family in one of Europe's great trading cities. Trade makes you rich, but every ship can carry the plague. The game follows the real timeline: the plague reaches each city in the half-year it really did. Along the way you will face the same choices real people faced: to flee or to stay, to trust physicians who could not cure the disease {{fact:ME-08}}, to answer the Church's call, to obey or ignore England's wage laws {{fact:EC-05}}, and whether to stand up for neighbors falsely blamed for the plague {{fact:SO-07}}."}]},{id:"objective",title:"Objective",blocks:[{type:"p",text:"A standard game lasts **{{rounds}} rounds** of half a year each, from Late 1347 to Early 1353; **Quick Play** covers the same years in 4 rounds of a year and a half. With **pre-plague rounds** switched on (the default), the game starts earlier: {{prePlague.rounds.standard}} extra rounds in the standard game (Late 1346 and Early 1347) and {{prePlague.rounds.quick}} in Quick Play, to set up trade before the plague arrives. When it ends, the house with the highest **Legacy score** wins. Legacy combines **Wealth**, **Family** and **Reputation**, plus a **Balance bonus** equal to your weakest of the three. A balanced house usually beats a greedy one. No one is ever knocked out of the game."}]},{id:"components",title:"Components (on screen)",blocks:[{type:"list",items:["**The map**: 35 real cities, from Dublin and Edinburgh to Gibraltar, Cairo, Damascus and Tana, joined by sea routes (solid lines) and land routes (dashed lines). Each route shows its base value.","**City markers**: *Safe* (plain). *Safe* cities can also be *Threatened* (dashed orange ring: a neighbouring city is Stricken). *Stricken* cities have a red ring, a hatched centre and 1\u20133 severity pips; *Aftermath* cities have a grey ring and a \u2766 mark.","**House crests**: each player has a color and a shape (circle, square, triangle, diamond, hexagon or star). A banner by a city is a trading post; the number on it shows how many family members live there.","**Dice**: turn-order, profit, contagion, severity and mortality dice, all rolled by the computer with animation.","**Cards**: dated *Chronicle* cards, a shuffled deck of 34 *Event* cards, and a personal deck of 22 *Fortune* cards.","**Tracks and Journal**: florins (\u0192), reputation (0\u2013{{limits.maxReputation}}), family, a live Legacy score, and the Historian's Journal of every fact you meet, with its source."]}]},{id:"setup",title:"Setup",blocks:[{type:"list",items:["Choose {{players.min}}\u2013{{players.max}} players. Each picks a house name and a different home city (Venice, Genoa, Florence, Marseille, Barcelona, London, Bruges or L\xFCbeck). Colors and crests are assigned by seat.","Each house starts with **{{start.florins}} florins**, **{{start.family}} family members** in the home city, **{{start.reputation}} reputation** and **one trading post** in the home city. To balance their routes and plague dates, home cities start with slightly different amounts of money, shown on the setup screen.","Choose **Standard** or **Quick Play**, and a difficulty: **Apprentice** (gentler plague, hints all game), **Chronicler** (standard) or **Great Mortality** (severity rolls +1, contagion risk +1).","Two options, both on unless you switch them off: **Pre-plague rounds** (see *How a Round Works*) and the **turn timer**: each house has **{{turnTimer.seconds}} seconds** per turn. The clock stops while cards and dice are on screen. When time runs out, any card still waiting is declined (a wage law is obeyed) and the next house plays.","**Bots (optional):** any house can be played by a computer. Set *Played by* to *A bot* on the setup screen (on several devices, press *Add a bot* in the lobby) and choose its skill: **Easy** (a simple style, often makes mistakes), **Medium** (sometimes slips) or **Hard** (weighs every choice by Legacy points). At least one house must be played by a person, so you can play alone against bots. A bot plays by the same rules and sees only what a person sees on screen. Its moves are shown one at a time, and cards during its turn go on by themselves after {{bots.cardSeconds}} seconds.","Caffa and Tana begin Stricken. Each house rolls a die: the highest goes first and tied houses roll again. **This turn order stays the same all game.**","**Playing on several devices (optional):** choose *Everyone on their own device*. The big screen shows the map, the dice and every card, plus a room code. Each player joins on a phone, tablet or computer with *Join a game* and the code, and takes their turn there. On a card, anyone can press *Next*. Each device can also show the rules, the Journal, the map and the current card. A player who has to go can press *Leave game*: their house sits out (turns skipped, card offers turned down) until they join again with the same code."]}]},{id:"round",title:"How a Round Works",blocks:[{type:"p",text:"Every round has four phases:"},{type:"list",ordered:!0,items:["**Chronicle.** The date advances. The plague reaches every city whose real arrival date falls in this round; each becomes Stricken and rolls severity. Then the round's dated Chronicle cards are read.","**Event.** One Event card is drawn. If it offers a choice, each player decides at the start of their own turn.","**Actions.** Players take turns in the fixed order, each with **{{modes.standard.actionPoints}} action points (AP)** ({{modes.quick.actionPoints}} in Quick Play). Most actions take 1 AP, but **Open Trading Post** and **Move Family** take {{actionPointCosts.post}}. A pass-the-device screen appears between turns.","**Plague & upkeep.** Family members in Stricken cities roll for survival. Cities Stricken for {{plague.strickenRounds}} half-years move to Aftermath. Land wages are paid, loans that are due are repaid, and partnerships and closed gates that have run their course end."]},{type:"note",text:"Quick Play: each round covers three half-years at once, so arrivals and Chronicle cards for all three are read, and the plague phase happens three times (three survival rolls)."},{type:"note",text:"Pre-plague rounds: in 1346 and early 1347 the plague has only reached Caffa and Tana on the Black Sea {{fact:TR-02}} {{fact:TL-13}}. There is no Event card and no survival roll, only upkeep, and opening a trading post costs {{prePlague.postDiscount}}\u0192 less, so houses can set up their trade before the plague sails west."}]},{id:"actions",title:"Actions",blocks:[{type:"p",text:"Spend your action points on the actions below, in any order. Most take **1 AP**. **Open Trading Post** and **Move Family** are bigger undertakings and take **{{actionPointCosts.post}} AP**: in the standard game that is your whole turn, and in Quick Play it leaves 1 AP. Take a Loan and Propose a Partnership take no AP. A Fortune or Event card that makes an action free also means it takes no AP."},{type:"table",head:["Action (key)","Cost","What it does"],rows:[["**Ship Goods** (1)","1 AP","Choose one of your trading posts that has not shipped this round and a route leaving it. Earn the route value + the profit die (1\u2013{{shipping.profitDie}}) + {{gains.familyAtPostBonus}} if a family member lives at that post + {{gains.aftermathPriceBonus}} if the destination is in Aftermath, minus {{costs.wageAftermath}} wage if the origin is in Aftermath. If the origin is Stricken, the contagion die is rolled too (see *Plague*). You may pay {{costs.holdOffshore}}\u0192 more to **hold the ship offshore** (see *Plague*)."],["**Open Trading Post** (2)","{{actionPointCosts.post}} AP + {{costs.openPost}}\u0192","Open a post in a city connected by a route to one of your posts. It cannot be a Stricken city. You may own at most {{limits.maxPosts}} posts."],["**Move Family** (3)","{{actionPointCosts.move}} AP","Move up to {{limits.moveFamilyMax}} family members from one of your cities or your Country Estate to another. **Fleeing** (leaving a Stricken city) costs {{penalties.fleeReputation}} reputation. Family at the Estate is safe from the plague, but earns no family bonus."],["**Prepare Household** (4)","1 AP + {{costs.prepareHousehold}}\u0192","Pick a city where your family lives. They shut themselves in and stockpile food, the way some families isolated themselves in 1348 {{fact:SO-05}}. This round their survival rolls there get +{{plague.prepareBonus}}."],["**Consult Physician** (5)","1 AP + {{costs.physician}}\u0192","Pick a city where your family lives. You learn a real remedy of the time, and none of them worked {{fact:ME-06}}. Basic nursing gives a slim chance: this round, the first family member there who would die rolls again and survives on a {{plague.physicianSaveOn}}."],["**Charity & Piety** (6)","1 AP + {{costs.charity}}\u0192","Fund a hospital, a confraternity or your parish church: +{{gains.charityReputation}} reputation. Once per turn. The house in last place pays {{costs.charityDiscountLastPlace}}\u0192 less."],["**Arrange a Marriage** (7)","1 AP + {{costs.marriage}}\u0192","Only in a city in **Aftermath** where you have a post and family: +{{gains.marriageFamily}} family member there. After the epidemic, survivors married and many children were born {{fact:SO-12}}. Your family cannot grow beyond {{start.family}}. Once per turn."],["**Buy Abandoned Land** (8)","1 AP + {{costs.buyLand}}\u0192","Only near a city in **Aftermath** where you have a post, one holding per city. So many farmers died that fields lay empty {{fact:EC-02}}. Each holding is worth {{scoring.pointsPerLand}} Wealth points at the end, but workers were scarce {{fact:EC-03}}: pay {{costs.landWage}}\u0192 per holding in every plague phase, or lose 1 reputation if you cannot."],["**Take a Loan** (9)","no AP","Borrow {{gains.loan}}\u0192 now and repay {{costs.loanRepay}}\u0192 in the plague phase of the next round. Florence's great banks had failed just before the plague {{fact:EC-01}}. If you cannot pay in full, you pay what you have and lose {{penalties.loanDefaultReputation}} reputation. One loan at a time; not in the final round."],["**Propose a Partnership** (0)","no AP","Offer another house a partnership (once per turn). They accept or decline at the start of their next turn. Until the end of the next round, when either partner ships to a city where the other has a post, the shipper earns {{gains.dealShipperBonus}}\u0192 more and the partner {{gains.dealBonus}}\u0192, like the linked trade networks of Italy and the Hanseatic League {{fact:TR-04}}. One partner at a time."],["**Close Your Gates** (G)","1 AP, \u2212{{penalties.gatesReputation}} reputation","Pick a city that is not Stricken where you have a post and family. Until the end of the next round, rival houses cannot open a post there and earn {{penalties.gatesProfit}}\u0192 less shipping to it. Frightened towns really did turn strangers away {{fact:SO-11}}. One city at a time."],["**End Turn** (E)","\u2013","Unused action points are lost."]]},{type:"note",text:'The game blocks illegal moves and explains why, for example: "Florence is Stricken: its gates are closed to new trading posts."'}]},{id:"plague",title:"The Plague",blocks:[{type:"list",items:["**Historical spread.** At the start of each round, the plague reaches the cities it really reached in that half-year. The date and its source are shown in a Historical Note.","**Severity.** Each newly Stricken city rolls the severity die: 1\u20132 **Light** (1 pip), 3\u20134 **Heavy** (2), 5\u20136 **Devastating** (3). Hard-hit Tuscany and Catalonia (Florence, Pisa, Barcelona) add 1; Flanders (Bruges) subtracts 1 {{fact:CI-06}}. On Apprentice difficulty, every roll is 1 lower (never below Light).","**Contagion.** When you ship from a Stricken city, the contagion die is rolled. If it is equal to or lower than that city's severity, the cargo is **infected**: you earn only half the profit (rounded down) and lose {{penalties.infectedCargoReputation}} reputation, as ports blamed plague ships {{fact:CI-11}}. If the destination is Safe and the plague really reached it in the *next* round, it becomes Stricken now, {{plague.earlyArrivalWindow}} round early. If the destination is already Stricken, its severity rises by 1 (maximum 3). Otherwise the infection dies out. **Holding a ship offshore** (+{{costs.holdOffshore}}\u0192) means an infected cargo still earns half, but you lose no reputation and it cannot spread. By 1348 Venice made arriving ships wait before sailors could land {{fact:ME-12}}; formal quarantine only came in 1377 {{fact:ME-14}}.","**Survival.** In the Plague phase, each family member in a Stricken city rolls the mortality die, adding +{{plague.prepareBonus}} if the household was prepared. If the result is equal to or lower than the severity, that family member dies.","**The last heir.** A house's last family member never dies; a distant cousin inherits. No one is eliminated.","**Inheritance.** For each family member lost, the house inherits {{gains.inheritance}}\u0192. Survivors really did inherit the property of the dead {{fact:EC-10}}.","**Aftermath.** After {{plague.strickenRounds}} rounds a Stricken city enters Aftermath. Workers are scarce and prices are high {{fact:EC-03}} {{fact:EC-04}}: shipping *from* it costs a wage, and shipping *to* it earns a bonus."]}]},{id:"events",title:"Chronicle and Event Cards",blocks:[{type:"list",items:["**Chronicle cards** are real, dated history and always appear in their round, for example the Ordinance of Labourers in Early 1349 {{fact:EC-05}} and the Jubilee of 1350 {{fact:CH-08}}.","**Event cards** are drawn one per round from a shuffled deck of 34, so each game is different. Some affect every house; some fall on one house chosen at random.","**Fortune cards** are personal. You draw one whenever you roll a {{fortune.drawOnProfitDie}} on the profit die or open a new trading post: spice cargoes, extra action points, free posts, warnings of where the plague goes next, but also demanding workers, illness and nervous creditors.",`**Offers** ("Buy a Book of Hours?") are accepted or declined at the start of your turn (Fortune offers at once). Some offers are traps from history: the remedy seller's cure does nothing.`,"**Wage laws.** If you own a post in London or Melcombe Regis, choose: **Obey** (+{{wageLaw.obeyReputation}} reputation, but your English posts cannot ship this round, because workers refuse the old wages) or **Pay market wages** (roll a die: on 1\u2013{{wageLaw.fineMaxRoll}} you are fined {{wageLaw.fine}}\u0192). The real laws failed to hold wages down {{fact:EC-07}}.","**Persecution.** The game shows the persecution of Jewish communities because it really happened, and because the accusations were **false** and the violence **unjust** {{fact:SO-07}} {{fact:SO-09}}. When it appears, any house may **Protect the Community** for {{costs.protectCommunity}}\u0192 and 1 AP at the start of its turn, gaining {{gains.protectReputation}} reputation. No house can ever gain anything from persecution. Whatever players choose, the city suffers unrest: shipments to or from it earn {{penalties.unrestProfit}} less for {{penalties.unrestRounds}} rounds. Pope Clement VI condemned the accusations, but his words had little effect far from Avignon {{fact:SO-08}}."]}]},{id:"scoring",title:"Scoring and Winning",blocks:[{type:"table",head:["Category","Points"],rows:[["**Wealth**","1 per {{scoring.florinsPerPoint}}\u0192 (rounded down), plus {{scoring.pointsPerPost}} per trading post, plus {{scoring.pointsPerLand}} per land holding"],["**Family**","{{scoring.pointsPerFamily}} per surviving family member"],["**Reputation**","1 per reputation point up to {{scoring.reputationSoftCap}}, then 1 per {{scoring.reputationHighRate}} points above that (a spotless name matters, but only so much)"],["**Balance bonus**","Add your *lowest* of Wealth, Family and Reputation again"]]},{type:"p",text:"Highest Legacy wins. Ties go to higher reputation, then more family; if still tied, the houses share the victory."},{type:"p",text:"**Comebacks.** From round {{comeback.guildFavorFromRound}} on (counted in half-years), a house in last place that trails the leader by {{comeback.guildFavorMinGap}} or more Legacy points receives **Guild's Favor**: +{{comeback.guildFavorAP}} AP. Inheritance, the Survivors Marry chronicle, weddings, loans and cheaper charity also help houses that fall behind."}]},{id:"reference",title:"Quick Reference",blocks:[{type:"list",items:["**Round:** Chronicle \u2192 Event \u2192 Actions ({{modes.standard.actionPoints}} AP each; {{modes.quick.actionPoints}} in Quick Play) \u2192 Plague & upkeep. Turn order never changes.","**Timer:** {{turnTimer.seconds}} seconds per turn (optional; paused while cards are shown). **Pre-plague rounds** (optional): no Event card, no survival rolls, posts {{prePlague.postDiscount}}\u0192 cheaper.","**Action points:** 1 AP per action \xB7 Open Trading Post {{actionPointCosts.post}} AP \xB7 Move Family {{actionPointCosts.move}} AP \xB7 Loan and Partnership 0 AP.","**Ship:** route value + profit die + family {{gains.familyAtPostBonus}} + Aftermath destination {{gains.aftermathPriceBonus}} \u2212 Aftermath wage {{costs.wageAftermath}}. From a Stricken city: contagion die \u2264 severity means infected (half profit, \u2212{{penalties.infectedCargoReputation}} reputation, may spread). Profit die {{fortune.drawOnProfitDie}}: draw a Fortune card.","**Survival:** mortality die (+{{plague.prepareBonus}} if prepared) \u2264 severity means the family member dies. The last heir always survives. Each loss inherits {{gains.inheritance}}\u0192.","**Costs:** Post {{costs.openPost}}\u0192 \xB7 Prepare {{costs.prepareHousehold}}\u0192 \xB7 Physician {{costs.physician}}\u0192 \xB7 Charity {{costs.charity}}\u0192 \xB7 Protect {{costs.protectCommunity}}\u0192 + 1 AP \xB7 Offshore +{{costs.holdOffshore}}\u0192 \xB7 Marriage {{costs.marriage}}\u0192 \xB7 Land {{costs.buyLand}}\u0192 (+{{costs.landWage}}\u0192 per half-year) \xB7 Loan +{{gains.loan}}\u0192 now, {{costs.loanRepay}}\u0192 next round \xB7 Gates \u2212{{penalties.gatesReputation}} reputation.","**Keys:** 1\u20136 actions \xB7 7 marriage \xB7 8 land \xB7 9 loan \xB7 0 partnership \xB7 G gates \xB7 E end turn \xB7 R rules \xB7 J journal \xB7 M sound \xB7 N music \xB7 Enter confirm \xB7 Esc cancel."]}]},{id:"glossary",title:"Glossary",blocks:[{type:"defs",items:[["Aftermath","A city the plague has passed through, now short of workers and with high prices. {{fact:EC-02}}"],["Bull (papal)","An official document from the pope, named after the metal seal attached to it. {{fact:CH-09}}"],["Cog / galley","Kinds of merchant ship: cogs sailed the northern seas, galleys the Mediterranean. {{fact:TR-04}} {{fact:TR-06}}"],["Flagellants","Penitents who marched between towns whipping themselves to beg God's mercy. {{fact:SO-02}}"],["Florin (\u0192)","A famous gold coin first minted in Florence in 1252. {{fact:EC-11}}"],["Hanseatic League","A network of German trading cities and their ships in the North Sea and Baltic. {{fact:TR-04}}"],["Humors","Body fluids that medieval doctors believed had to stay in balance. {{fact:ME-05}}"],["Miasma",'"Bad air," wrongly believed to cause the plague. {{fact:ME-04}}'],["Quarantine","Isolation of travelers, first made law in Ragusa in 1377, after this game ends. {{fact:ME-14}}"],["Stricken","A city where the plague is raging. Severity: Light, Heavy or Devastating."]]}]}]};var ao={note:`The actions. Actions with group "ledger" appear under Merchant's Ledger in the sidebar. factIds are the history shown in the Historical Note when the action is used. Remedies are drawn by Consult Physician.`,actions:[{id:"ship",key:"1",name:"Ship Goods",short:"Send cargo along a route for profit",factIds:["TR-04","TR-05"]},{id:"post",key:"2",name:"Open Trading Post",short:"Expand your network to a connected city",factIds:["TR-04"]},{id:"move",key:"3",name:"Move Family",short:"Move family between cities, or flee to your estate",factIds:["SO-04"]},{id:"prepare",key:"4",name:"Prepare Household",short:"Isolate and stockpile: better survival odds",factIds:["SO-05","ME-12"]},{id:"physician",key:"5",name:"Consult Physician",short:"Medieval medicine: a slim chance, no cure",factIds:["ME-08","ME-01"]},{id:"charity",key:"6",name:"Charity & Piety",short:"Support hospital or church for reputation",factIds:["CH-03","CH-07"]},{id:"marry",key:"7",name:"Arrange a Marriage",short:"After the plague passes, grow your family again",group:"ledger",factIds:["SO-12"]},{id:"land",key:"8",name:"Buy Abandoned Land",short:"Empty fields are cheap after the plague, but wages are high",group:"ledger",factIds:["EC-02","EC-10","EC-03"]},{id:"loan",key:"9",name:"Take a Loan",short:"Borrow now, repay more next round (no action point)",group:"ledger",factIds:["EC-01","EC-11"]},{id:"deal",key:"0",name:"Propose a Partnership",short:"Share profits with another house (no action point)",group:"ledger",factIds:["TR-04"]},{id:"gates",key:"g",name:"Close Your Gates",short:"Turn rival merchants away from one of your cities",group:"ledger",factIds:["SO-11"]}],remedies:[{id:"bloodletting",name:"Bloodletting",text:"The physician opens a vein to 'reduce the blood' and rebalance the humors.",factIds:["ME-06","ME-05"]},{id:"aloe",name:"Pills of aloe",text:"Purging pills are meant to drive out corrupt humors.",factIds:["ME-06"]},{id:"fire",name:"Fires to purify the air",text:"Fires are lit to burn away the 'corrupt air.'",factIds:["ME-06","ME-04"]},{id:"theriac",name:"Theriac",text:"An expensive compound medicine is prescribed to 'comfort the heart.'",factIds:["ME-06"]},{id:"figs",name:"Figs and onions",text:"A poultice of cooked figs and onions is laid on the swellings.",factIds:["ME-06","ME-02"]},{id:"herbs",name:"Sweet-smelling herbs",text:"Flowers and spices are held to the nose against bad air.",factIds:["ME-07"]},{id:"stars",name:"The stars",text:"The physician blames the conjunction of the planets in 1345.",factIds:["ME-04"]}]};var E={config:ri,facts:to.facts,categories:to.categories,sources:no.sources,accessed:no.accessed,cities:si.cities,routes:li.routes,timeline:ci,chronicle:aa.chronicle,deck:aa.deck,fortune:aa.fortune,rulebook:di,actions:ao.actions,remedies:ao.remedies},Xt=Object.fromEntries(E.facts.map(t=>[t.id,t])),oo=Object.fromEntries(E.sources.map(t=>[t.id,t])),A=Object.fromEntries(E.cities.map(t=>[t.id,t])),Oe=E.cities.filter(t=>t.home).map(t=>t.id);function io(t){let e=2166136261;for(let n of String(t))e=Math.imul(e^n.charCodeAt(0),16777619);return e>>>0}function Ve(t){let e=t.rng=t.rng+1831565813>>>0;return e=Math.imul(e^e>>>15,e|1),e^=e+Math.imul(e^e>>>7,e|61),((e^e>>>14)>>>0)/4294967296}function Ee(t,e=6){return 1+Math.floor(V
